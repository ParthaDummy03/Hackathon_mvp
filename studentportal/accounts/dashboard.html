{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    <div class="bg-shapes">
        <span class="shape shape-1"></span>
        <span class="shape shape-2"></span>
        <span class="shape shape-3"></span>
    </div>

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            <span>Student Portal</span>
        </div>
        <a href="{% url 'logout' %}" class="btn-logout">
            Logout
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </a>
    </header>

    <main class="dashboard-main">
        <div class="welcome-banner">
            <div>
                <h1>Welcome back, {{ full_name }}! 👋</h1>
                <p>Here's a quick overview of your academic profile.</p>
            </div>
        </div>

        <div class="cards-grid">
            <div class="info-card card-blue" style="animation-delay: 0.1s;">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div class="card-content">
                    <span class="card-label">Full Name</span>
                    <span class="card-value">{{ full_name }}</span>
                </div>
            </div>

            <div class="info-card card-green" style="animation-delay: 0.2s;">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="16" rx="2"/>
                        <line x1="7" y1="9" x2="17" y2="9"/>
                        <line x1="7" y1="13" x2="17" y2="13"/>
                    </svg>
                </div>
                <div class="card-content">
                    <span class="card-label">Student ID</span>
                    <span class="card-value">{{ student_id }}</span>
                </div>
            </div>

            <div class="info-card card-purple" style="animation-delay: 0.3s;">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <span class="card-label">Enrolled Course</span>
                    <span class="card-value">{{ course }}</span>
                </div>
            </div>

            <div class="info-card card-orange" style="animation-delay: 0.4s;">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                </div>
                <div class="card-content">
                    <span class="card-label">Section</span>
                    <span class="card-value">{{ section }}</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
